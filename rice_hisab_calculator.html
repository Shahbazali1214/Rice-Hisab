<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>Rice Hisab Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f2;font-family:Arial,sans-serif;color:#17251b}
main{max-width:460px;margin:22px auto;padding:18px}
.panel{background:white;border-radius:20px;padding:22px;box-shadow:0 5px 24px #18351c14}
h1{font-size:25px;margin:0 0 6px;color:#14532d} .sub{color:#66736a;font-size:14px;margin:0 0 22px}
label{display:block;font-weight:700;margin:16px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #cbd5cc;border-radius:12px;font-size:19px;background:white}
.hint{font-size:12px;color:#66736a;margin-top:6px}
.result{margin-top:22px;background:#e9f5eb;border-radius:16px;padding:18px}
.small{font-size:13px;color:#47634d}.answer{font-size:30px;font-weight:800;color:#14532d;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #d5e6d8}
button{margin-top:16px;width:100%;border:0;border-radius:12px;padding:14px;background:#14532d;color:white;font-size:16px;font-weight:700}
footer{font-size:12px;color:#718075;text-align:center;margin:16px}
</style>
</head>
<body>
<main><section class="panel">
<h1>🌾 Rice Hisab Calculator</h1>
<p class="sub">Mann aur kilo ka mandi hisaab</p>
<label>Wazan (Mann.Kilo)</label>
<input id="weight" inputmode="decimal" value="305.00" placeholder="Misal: 137.15">
<div class="hint">137.15 ka matlab 137 Mann aur 15 Kilo hai (40 kilo = 1 Mann).</div>
<label>Har Mann par cut (Kilo)</label>
<select id="cut"><option value="1">1 Kilo</option><option value="2">2 Kilo</option><option value="3">3 Kilo</option><option value="4">4 Kilo</option><option value="0">Cut nahi</option></select>
<div class="result" aria-live="polite">
<div class="small">Cut ke baad final wazan</div>
<div class="answer" id="answer">297 Mann 15 Kilo</div>
<div class="row"><span>Asal wazan</span><b id="gross">12,200 Kilo</b></div>
<div class="row"><span>Total cut</span><b id="deduct">305 Kilo</b></div>
<div class="row"><span>Baqi wazan</span><b id="net">11,895 Kilo</b></div>
</div>
<button onclick="resetForm()">Reset</button>
</section><footer>Hisab: 1 Mann = 40 Kilo</footer></main>
<script>
const w=document.getElementById('weight'),c=document.getElementById('cut');
function fmt(n){return n.toLocaleString('en-US',{maximumFractionDigits:3})}
function calc(){
 let s=w.value.trim();
 let m=s.match(/^(\d+)(?:\.(\d{1,2}))?$/);
 if(!m){document.getElementById('answer').textContent='Wazan durust likhein';return}
 let mann=Number(m[1]), kilo=Number((m[2]||'0').padEnd(2,'0'));
 if(kilo>=40){document.getElementById('answer').textContent='Kilo 0 se 39 tak likhein';return}
 let gross=mann*40+kilo, cut=mann*Number(c.value), net=Math.max(0,gross-cut);
 let outM=Math.floor(net/40),outK=net%40;
 document.getElementById('answer').textContent=outM+' Mann '+outK+' Kilo';
 document.getElementById('gross').textContent=fmt(gross)+' Kilo';
 document.getElementById('deduct').textContent=fmt(cut)+' Kilo';
 document.getElementById('net').textContent=fmt(net)+' Kilo';
}
function resetForm(){w.value='305.00';c.value='1';calc()}
w.addEventListener('input',calc);c.addEventListener('change',calc);calc();
</script>
</body></html>
